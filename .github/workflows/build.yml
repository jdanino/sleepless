name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Show the toolchain
        run: |
          sw_vers
          swift --version

      - name: Build the app
        run: ./build.sh -          # "-" builds only, it does not install

      - name: Check the result
        run: |
          set -euo pipefail
          APP=build/Sleepless.app
          BIN="$APP/Contents/MacOS/Sleepless"

          # Both architectures must be present.
          ARCHS="$(lipo -archs "$BIN")"
          echo "Architectures: $ARCHS"
          for want in arm64 x86_64; do
            case " $ARCHS " in *" $want "*) ;; *) echo "Missing $want"; exit 1;; esac
          done

          # The bundle must be complete and correct.
          plutil -lint "$APP/Contents/Info.plist"
          test -f "$APP/Contents/Resources/Sleepless.icns" || { echo "No icon"; exit 1; }
          codesign --verify --strict --verbose=2 "$APP"

          # The app must not start in the Dock.
          /usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$APP/Contents/Info.plist"

      - name: Make a zip
        run: ditto -c -k --keepParent build/Sleepless.app build/Sleepless.zip

      - uses: actions/upload-artifact@v5
        with:
          name: Sleepless-app
          path: build/Sleepless.zip
          if-no-files-found: error
