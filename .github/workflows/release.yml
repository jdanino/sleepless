name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to build and release again
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Import the signing certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          # A keychain that lives only as long as this job.
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          PASSWORD="$(uuidgen)"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"

          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          # Without this, codesign asks for permission and hangs forever.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$PASSWORD" "$KEYCHAIN" >/dev/null

          # Put it in the search list, so `security find-identity` sees it.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

          security find-identity -v -p codesigning | grep "Developer ID Application"

      - name: Write the notarisation key
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey.p8"

      - name: Build, sign, notarise, staple
        env:
          APPLE_API_KEY: ${{ runner.temp }}/keys/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          EXPECTED_VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          ./release.sh --check
          EXPECTED_VERSION="${EXPECTED_VERSION#v}" ./release.sh

      - name: Prove it the way Gatekeeper does
        run: |
          set -euo pipefail
          DMG="$(ls build/Sleepless-*.dmg)"

          # A download in a browser carries this flag. Judge it with the flag on.
          cp "$DMG" "$RUNNER_TEMP/check.dmg"
          xattr -w com.apple.quarantine "0081;00000000;Safari;" "$RUNNER_TEMP/check.dmg"
          spctl -a -t open --context context:primary-signature -vv "$RUNNER_TEMP/check.dmg"

          hdiutil attach -nobrowse -quiet "$RUNNER_TEMP/check.dmg" -mountpoint "$RUNNER_TEMP/mnt"
          # The app must carry its own ticket, so a first start with no network works.
          cp -R "$RUNNER_TEMP/mnt/Sleepless.app" "$RUNNER_TEMP/dragged.app"
          hdiutil detach -quiet "$RUNNER_TEMP/mnt"
          xcrun stapler validate "$RUNNER_TEMP/dragged.app"
          spctl -a -vv "$RUNNER_TEMP/dragged.app"

          ARCHS="$(lipo -archs "$RUNNER_TEMP/dragged.app/Contents/MacOS/Sleepless")"
          echo "Architectures: $ARCHS"
          for want in arm64 x86_64; do
            case " $ARCHS " in *" $want "*) ;; *) echo "Missing $want"; exit 1;; esac
          done

      - name: Clean the secrets off the runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/build.keychain-db"

      - name: Attach the DMG to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          DMG="$(ls build/Sleepless-*.dmg)"
          NOTES="**$(basename "$DMG")** is signed with a Developer ID and notarised by Apple.
          Open it and drag the app to Applications. A plain double-click works.

          The app has no Dock icon. Look for the face in the menu bar."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" --clobber
          else
            gh release create "$TAG" "$DMG" --title "Sleepless ${TAG#v}" --notes "$NOTES"
          fi
